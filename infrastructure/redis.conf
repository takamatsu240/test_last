# Redis 本番環境設定ファイル
# バージョン: 7.2
# 用途: セッション管理とクエリキャッシュ

################################## ネットワーク ##################################

# バインドアドレス（本番環境ではローカルのみ）
bind 127.0.0.1 ::1

# ポート番号
port 6379

# TCP接続キュー
tcp-backlog 511

# クライアントタイムアウト（秒、0=無効）
timeout 0

# TCP keepalive（秒）
tcp-keepalive 300

################################## 一般設定 ##################################

# デーモンモード（Dockerではno）
daemonize no

# PIDファイル
pidfile /var/run/redis/redis-server.pid

# ログレベル（debug, verbose, notice, warning）
loglevel notice

# ログファイル（Dockerでは標準出力）
logfile ""

# データベース数
databases 16

# データベース説明
# DB 0: セッションストア
# DB 1: クエリキャッシュ
# DB 2: アプリケーションキャッシュ
# DB 3-15: 予約

################################## スナップショット（RDB） ##################################

# RDB保存条件
save 900 1      # 15分間に1回以上の変更
save 300 10     # 5分間に10回以上の変更
save 60 10000   # 1分間に10000回以上の変更

# RDB保存失敗時の書き込み停止
stop-writes-on-bgsave-error yes

# RDB圧縮
rdbcompression yes

# RDBチェックサム
rdbchecksum yes

# RDBファイル名
dbfilename dump.rdb

# データディレクトリ
dir /data

################################## レプリケーション ##################################

# レプリカの読み取り専用モード
replica-read-only yes

################################## セキュリティ ##################################

# パスワード認証（環境変数で設定推奨）
# requirepass YOUR_STRONG_PASSWORD_HERE

# ACL設定ファイル
# aclfile /etc/redis/users.acl

################################## クライアント ##################################

# 最大クライアント接続数
maxclients 10000

################################## メモリ管理 ##################################

# 最大メモリ（2GB）
maxmemory 2gb

# メモリ削除ポリシー
# - allkeys-lru: 全キーからLRUで削除（推奨：汎用キャッシュ）
# - volatile-lru: TTL付きキーからLRUで削除
# - allkeys-lfu: 全キーからLFUで削除
# - volatile-ttl: TTLが短いキーを削除
maxmemory-policy allkeys-lru

# LRU/LFU/TTLサンプル数（精度とパフォーマンスのトレードオフ）
maxmemory-samples 5

# レプリカへの削除通知
replica-ignore-maxmemory yes

################################## AOF（Append Only File） ##################################

# AOF有効化（より安全な永続化）
appendonly yes

# AOFファイル名
appendfilename "appendonly.aof"

# AOF同期頻度
# - always: 毎コマンド（最も安全、遅い）
# - everysec: 毎秒（推奨：パフォーマンスと安全性のバランス）
# - no: OSに任せる（最速、安全性低）
appendfsync everysec

# AOFリライト中の同期停止（パフォーマンス優先）
no-appendfsync-on-rewrite no

# AOF自動リライト条件
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# AOF読み込み時のエラー許容
aof-load-truncated yes

# AOFとRDBの混合フォーマット（高速リカバリ）
aof-use-rdb-preamble yes

################################## スローログ ##################################

# スローログ閾値（マイクロ秒、10ms以上を記録）
slowlog-log-slower-than 10000

# スローログ最大エントリ数
slowlog-max-len 128

################################## イベント通知 ##################################

# キーイベント通知（必要に応じて有効化）
notify-keyspace-events ""

################################## 高度な設定 ##################################

# ハッシュの最大エントリ数（小さいハッシュはziplist）
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# リストの圧縮設定
list-max-ziplist-size -2
list-compress-depth 0

# セットの最大整数エントリ数
set-max-intset-entries 512

# ソート済みセットの最大エントリ数
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLogの疎密エンコード閾値
hll-sparse-max-bytes 3000

# ストリーム設定
stream-node-max-bytes 4096
stream-node-max-entries 100

# アクティブリハッシュ
activerehashing yes

# クライアント出力バッファ制限
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# クライアントクエリバッファ制限
# client-query-buffer-limit 1gb

# プロトコルバルク制限
# proto-max-bulk-len 512mb

# HZ頻度（内部タイマー、10-500）
hz 10

# 動的HZ
dynamic-hz yes

# AOFリライト時のHZ削減
aof-rewrite-incremental-fsync yes

# RDB保存時のHZ削減
rdb-save-incremental-fsync yes

################################## レイジーフリー（非同期削除） ##################################

# メモリ削除を非同期化（パフォーマンス向上）
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# レイジーフリーのユーザーコマンド対応
lazyfree-lazy-user-del no

################################## スレッド I/O ##################################

# I/Oスレッド数（CPUコア数-1推奨）
io-threads 4

# 読み取りI/Oスレッド有効化
io-threads-do-reads yes

################################## TLS/SSL（本番環境推奨） ##################################

# TLS有効化（必要に応じて設定）
# port 0
# tls-port 6379
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt
